[project]
name = "flrw-numerical-simulations"
version = "0.2.6"
description = "Reproducible FLRW background cosmology simulations, figures, tests, Pantheon+SH0ES likelihood, and DESI DR2 BAO check."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Brandon Deonarine" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
