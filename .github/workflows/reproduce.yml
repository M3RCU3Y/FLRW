name: Reproduce numerical outputs

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Check package imports
        run: |
          python -c "import importlib; [importlib.import_module(m) for m in ('flrw_paper.core','flrw_paper.models','flrw_paper.distances','flrw_paper.datasets','flrw_paper.likelihoods','flrw_paper.plotting','flrw_paper.tables')]"

      - name: Verify retained data files
        run: python scripts/download_pantheon_data.py --verify-only

      - name: Run regression tests
        run: pytest -q

      - name: Regenerate figures and tables
        run: python scripts/generate_cosmology_figures.py

      - name: Ensure regenerated tables are committed
        run: git diff --exit-code -- 'figures/*.tex'

      - name: Ensure figure PDFs were regenerated
        run: |
          for file in figures/*.pdf; do
            test -s "$file"
          done
